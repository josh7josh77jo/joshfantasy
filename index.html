<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Josh Fantasy League</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Big+Shoulders+Display:wght@700;900&family=IBM+Plex+Sans:wght@400;500;600&display=swap" rel="stylesheet">
<style>
:root{--ice:#eef4f8;--panel:#fff;--ink:#14212e;--mute:#5d6f80;--line:#d3dee7;--red:#c8202f;--blue:#1d4f9c;--pos:#1a7f4b;
--disp:'Big Shoulders Display','Arial Narrow',Impact,sans-serif;--body:'IBM Plex Sans',system-ui,sans-serif;
box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--ice:#0d1620;--panel:#15222f;--ink:#e8f0f6;--mute:#8fa3b5;--line:#25384a;--red:#ef4b58;--blue:#6fa2ee;--pos:#4cc58a;color-scheme:dark}}
:root[data-theme="dark"]{--ice:#0d1620;--panel:#15222f;--ink:#e8f0f6;--mute:#8fa3b5;--line:#25384a;--red:#ef4b58;--blue:#6fa2ee;--pos:#4cc58a;color-scheme:dark}
*{box-sizing:inherit}html{scroll-padding-top:env(safe-area-inset-top,0px)}
body{margin:0;background:var(--ice);color:var(--ink);font:400 16px/1.5 var(--body)}
.wrap{max-width:900px;margin:0 auto;padding:0 18px 60px}
header{padding:34px 0 14px;position:relative}
header:before{content:"";display:block;height:6px;background:linear-gradient(90deg,var(--blue) 0 30%,var(--red) 30% 70%,var(--blue) 70%);border-radius:3px;margin-bottom:22px}
h1{font:900 clamp(40px,9vw,72px)/.92 var(--disp);margin:0;letter-spacing:.01em}
.sub{color:var(--mute);margin:8px 0 0}
nav{display:flex;gap:6px;margin:22px 0;border-bottom:2px solid var(--line);overflow-x:auto}
nav a{font:700 22px var(--disp);color:var(--mute);text-decoration:none;padding:6px 14px 8px;border-bottom:4px solid transparent;margin-bottom:-2px;white-space:nowrap}
nav a[aria-current=page]{color:var(--ink);border-color:var(--red)}
nav a:focus-visible,button:focus-visible,input:focus-visible,select:focus-visible{outline:3px solid var(--blue);outline-offset:2px}
h2{font:800 30px var(--disp);margin:0 0 12px}
.scroll{overflow-x:auto}
table{width:100%;border-collapse:collapse;background:var(--panel);border:1px solid var(--line);border-radius:8px;overflow:hidden;min-width:520px}
th,td{padding:10px 12px;text-align:right;border-bottom:1px solid var(--line)}
th{font-weight:600;font-size:13px;color:var(--mute)}
th:nth-child(2),td:nth-child(2){text-align:left}
td.rk{font:900 34px/1 var(--disp);color:var(--blue);width:56px;text-align:center}
tr.me{background:color-mix(in srgb,var(--red) 9%,var(--panel))}
tr.me td.rk{color:var(--red)}
.team{font-weight:600}.own{color:var(--mute);font-size:13px;display:block;font-weight:400}
.hot{color:var(--pos);font-weight:600}.cold{color:var(--red);font-weight:600}
.board{display:grid;gap:14px;grid-template-columns:repeat(auto-fit,minmax(280px,1fr))}
.game{background:var(--panel);border:1px solid var(--line);border-radius:8px;padding:14px 16px}
.row{display:flex;justify-content:space-between;align-items:baseline;gap:10px;padding:4px 0}
.row b{font:900 40px/1 var(--disp)}.row.lead b{color:var(--red)}
.row span{font-weight:600}.proj{color:var(--mute);font-size:13px;margin-top:6px;border-top:1px dashed var(--line);padding-top:8px}
.cols{display:grid;gap:24px;grid-template-columns:repeat(auto-fit,minmax(300px,1fr))}
.p{display:flex;align-items:center;gap:10px;background:var(--panel);border:1px solid var(--line);border-radius:8px;padding:9px 12px;margin-bottom:8px}
.pos{font:800 18px var(--disp);width:34px;text-align:center;color:#fff;background:var(--blue);border-radius:4px;padding:2px 0}
.pos.G{background:var(--red)}.pos.D{background:#46607a}
.p .n{flex:1;font-weight:600}.p .n small{display:block;color:var(--mute);font-weight:400}
.pts{font:800 24px var(--disp);min-width:44px;text-align:right}
button{font:600 14px var(--body);border:1.5px solid var(--ink);background:transparent;color:var(--ink);border-radius:6px;padding:6px 12px;cursor:pointer}
button:hover{background:var(--ink);color:var(--ice)}button:disabled{opacity:.4;cursor:not-allowed}
.tools{display:flex;gap:10px;flex-wrap:wrap;margin-bottom:14px}
input,select{font:400 15px var(--body);padding:8px 10px;border:1px solid var(--line);border-radius:6px;background:var(--panel);color:var(--ink)}
input{flex:1;min-width:160px}
.note{color:var(--mute);font-size:14px}.msg{min-height:24px;color:var(--blue);font-weight:600;margin:0 0 8px}
.empty{padding:20px;border:1px dashed var(--line);border-radius:8px;color:var(--mute)}
.clock{background:var(--blue);color:#fff;border-radius:8px;padding:14px 18px;margin-bottom:14px;border-left:10px solid var(--red)}
.clock b{font:900 34px/1 var(--disp);display:block}.clock.done{background:var(--pos)}
.dgrid{display:grid;grid-template-columns:repeat(12,minmax(96px,1fr));gap:4px;min-width:1200px;margin-top:10px}
.dh{font:800 15px/1.1 var(--disp);padding:4px;color:var(--mute)}.dh.me{color:var(--red)}
.cell{min-height:54px;background:var(--panel);border:1px solid var(--line);border-radius:5px;padding:5px 6px;font-size:13px;line-height:1.25}
.cell small{display:block;color:var(--mute)}.cell.now{border:2px solid var(--red)}.cell.mine{background:color-mix(in srgb,var(--red) 9%,var(--panel))}
.cell .no{color:var(--mute);font-size:12px}
.dwrap{display:grid;gap:24px;grid-template-columns:minmax(260px,1fr) 2fr;align-items:start}
@media (max-width:760px){.dwrap{grid-template-columns:1fr}}
.form{display:grid;gap:12px;max-width:360px;margin-bottom:12px}.form label{display:grid;gap:4px;font-weight:600;font-size:14px}.form input{width:100%}
.adm td,.adm th{text-align:left}.adm select{width:100%;max-width:260px}
.lg{width:30px;height:30px;object-fit:contain;vertical-align:middle;margin-right:8px}
.nm .lg{float:left;width:38px;height:38px;margin-right:10px}
.lg.b{width:46px;height:46px}.lg.h{width:clamp(54px,12vw,86px);height:clamp(54px,12vw,86px);margin-right:14px}
.dh .lg{display:block;width:34px;height:34px;margin:0 0 4px}
.row .lg{width:28px;height:28px}
.pos{width:auto;min-width:42px;padding:2px 6px}
.acts{display:flex;gap:4px;flex-wrap:wrap;justify-content:flex-end}.acts button{padding:4px 8px;font-size:13px}
h3{font:800 22px var(--disp);margin:20px 0 8px}
.wk{margin:0 0 12px;border:1px solid var(--line);border-radius:8px;background:var(--panel)}.wk summary{cursor:pointer;padding:12px 16px;font:800 24px var(--disp);display:flex;justify-content:space-between;align-items:baseline}.wk summary span{font:400 14px var(--body);color:var(--mute)}.wk .board{padding:0 14px 14px}
</style>
</head>

const fmt=s=>{s=Math.max(0,Math.ceil(s));const d=Math.floor(s/86400),hr=Math.floor(s%86400/3600),m=Math.floor(s%3600/60);return(d?d+'d ':'')+(hr||d?hr+'h ':'')+(m||hr||d?m+'m ':'')+(s%60)+'s'};
setInterval(()=>{if(location.hash!='#draft'||!DSTART||!SET.timer||!DEAD||DR.length>=N*ROUNDS)return;const left=(DEAD-Date.now())/1000;
if(left<=0){if(SES&&APF!==DR.length){APF=DR.length;const t=new Set(DR.map(x=>x.pid)),b=DPLAYERS.filter(p=>!t.has(p.id)).sort((x,y)=>y.pts-x.pts)[0];if(b)sendPick(b.id,true)}return}
const k=$('#clk');if(k)k.textContent=fmt(left)+' left'},1000);
function settings(){if(!ADM)return `<h2>Settings</h2><div class='empty'>Only the commissioner can change league settings.</div>`;
const rng=(a,b)=>Array.from({length:b-a+1},(_,i)=>[a+i,a+i]);
const sel=(k,o,cur)=>`<select data-set='${k}'>${o.map(([v,l])=>`<option value='${v}' ${v==cur?'selected':''}>${l}</option>`).join('')}</select>`;
const me=SES&&SES.id;
const rows=ACCTS.slice().sort((a,b)=>a.username.localeCompare(b.username)).map(a=>{const k=KICKED.has(a.id);return `<tr><td>${esc(a.username)}${k?' (removed)':''}</td><td>${k?`<button data-restore='${esc(a.id)}'>Restore</button>`:a.id==me?'You':`<button data-kick='${esc(a.id)}'>Kick</button>`}</td></tr>`}).join('');
return `<h2>League settings</h2><p class='msg' role='status'>${esc(amsg)}</p><div class='form'><label>Teams in league${sel('teams',rng(2,12),SET.teams)}</label><label>Draft rounds${sel('rounds',rng(1,12),SET.rounds)}</label><label>Roster size${sel('roster',rng(2,16),SET.roster)}</label><label>Draft timer per pick${sel('timer',[[0,'No timer'],[60,'60 seconds'],[1800,'30 minutes'],[3600,'1 hour'],[86400,'1 day']],SET.timer)}</label></div><p class='note'>Changes save right away for everyone. Changing teams or rounds mid-draft moves the board, so reset the draft first. When a timer runs out, the best available player is picked automatically, as long as someone has the Draft tab open.</p><h2 style='margin-top:28px'>Members</h2>${ACCTS.length?`<div class='scroll'><table class='adm'><thead><tr><th>Username</th><th>Action</th></tr></thead><tbody>${rows}</tbody></table></div>`:`<div class='empty'>No accounts yet.</div>`}<p class='note'>Kicked members are signed out, can’t log back in, and lose their team until you restore them.</p>`}
async function saveSet(k,v){const r=await sb.from('settings').update({[k]:+v}).eq('id',1).select();amsg=dbok(r)?'Setting saved.':'Could not save. Only the commissioner can change settings.';await loadAll();render()}
async function kick(id){const r=await sb.from('profiles').update({kicked:true,team:null}).eq('id',id).select();amsg=dbok(r)?'Member removed.':'Could not remove the member.';await loadAll();render()}
async function restore(id){const r=await sb.from('profiles').update({kicked:false}).eq('id',id).select();amsg=dbok(r)?'Member restored.':'Could not restore the member.';await loadAll();render()}
const VIEWS={standings,matchups,roster,players,draft,account,settings};
function render(){const h=(location.hash||"#standings").slice(1);const k=VIEWS[h]?h:"standings";
document.querySelectorAll("#nav a").forEach(a=>a.removeAttribute("aria-current"));
document.querySelector(`#nav a[href="#${k}"]`).setAttribute("aria-current","page");
$("#view").innerHTML=VIEWS[k]();who();
const qi=$("#q");if(qi){qi.oninput=e=>{q=e.target.value;const pos=e.target.selectionStart;render();const n=$("#q");n.focus();n.setSelectionRange(pos,pos)}}
const ps=$("#pf");if(ps)ps.onchange=e=>{pf=e.target.value;render()}
const di=$("#dq");if(di){di.oninput=e=>{dq=e.target.value;const pos=e.target.selectionStart;render();const n=$("#dq");n.focus();n.setSelectionRange(pos,pos)}}
const dp=$("#dpf");if(dp)dp.onchange=e=>{dpf=e.target.value;render()}}
async function loadDraft(){if(!sb)return;try{const r=await sb.from('draft_state').select('*').eq('id',1).maybeSingle();
if(r.error){if(!DERR){DERR=true;soft()}return}
const dd=r.data||{},np=Array.isArray(dd.picks)?dd.picks:[],ns=!!dd.started,nd=+dd.deadline||0;
const ch=DERR||ns!==DSTART||nd!==DEAD||np.join()!==DR.map(x=>x.pid).join();
DERR=false;DR=np.map(pid=>({pid}));DSTART=ns;DEAD=nd;if(ch)soft()}catch(e){}}
async function sendPick(pid,auto){if(!sb)return;const p=DPLAYERS.find(x=>x.id==pid),who0=TEAMS[slot(DR.length)].n;
const r=await sb.rpc('make_pick',{pid,auto:!!auto});
msg=r.error?(auto?'':'Could not pick: '+r.error.message):(auto?'Time ran out. ':'')+who0+' drafted '+p.name+'.';await loadDraft();rc=false;render()}
async function saveName(){const t=myT(),v=($('#tn')&&$('#tn').value||'').trim();if(t<0)return;
if(!v||v.length>30){msg='Team names need 1 to 30 characters.';return render()}
const r=await sb.from('team_names').upsert({idx:t,name:v});msg=r.error?'Could not save the team name.':'Team name saved.';await loadAll();render()}
$("#view").addEventListener("click",async e=>{const d=e.target.dataset;
if(d.pick)sendPick(+d.pick,false);
if("auto" in d){const t=new Set(DR.map(x=>x.pid)),b=DPLAYERS.filter(p=>!t.has(p.id)).sort((x,y)=>y.pts-x.pts)[0];if(b)sendPick(b.id,false)}
if("dstart" in d&&ADM){const r=await sb.from('draft_state').update({started:true,picks:[],deadline:SET.timer?Date.now()+SET.timer*1000:null}).eq('id',1).select();msg=dbok(r)?'Draft started.':'Could not start the draft. Only admins can.';await loadDraft();render()}
if("undo" in d&&ADM&&DR.length){const r=await sb.from('draft_state').update({picks:DR.slice(0,-1).map(x=>x.pid),deadline:SET.timer?Date.now()+SET.timer*1000:null}).eq('id',1).select();msg=dbok(r)?'Last pick undone.':'Could not undo.';await loadDraft();render()}
if("reset" in d&&ADM){if(rc){const r=await sb.from('draft_state').update({started:false,picks:[],deadline:null}).eq('id',1).select();RS={added:[],cut:[],st:{}};saveRS();rc=false;msg=dbok(r)?'Draft reset.':'Could not reset.';await loadDraft()}else{rc=true;msg='Press again to clear all picks.'}render()}
});
addEventListener("hashchange",()=>{msg="";amsg="";render()});
$("#view").addEventListener("click",e=>{const d=e.target.dataset;if('logout' in d){sb.auth.signOut().then(()=>{SES=null;ADM=false;amsg='Logged out.';render()})}if('login' in d)doLogin();if('register' in d)doReg();if(d.kick)kick(d.kick);if(d.restore)restore(d.restore);if(d.start)setSt(d.start,'S');if(d.bench)setSt(d.bench,'B');if(d.ir)setSt(d.ir,'IR');if(d.cut)cutP(d.cut);if(d.fa)addFA(d.fa);if('savename' in d)saveName()});
$("#view").addEventListener("change",e=>{const d=e.target.dataset;if(d.assign)assign(d.assign,e.target.value);if(d.set)saveSet(d.set,e.target.value)});
render();
loadAll();setInterval(loadAll,20000);loadDraft();setInterval(loadDraft,3000);
</script>
</body>
</html>
