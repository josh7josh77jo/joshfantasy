<style>

.form{display:grid;gap:12px;max-width:360px;margin-bottom:12px}.form label{display:grid;gap:4px;font-weight:600;font-size:14px}.form input{width:100%}
.adm td,.adm th{text-align:left}.adm select{width:100%;max-width:260px}

.row .lg{width:28px;height:28px}
.pos{width:auto;min-width:42px;padding:2px 6px}
.acts{display:flex;gap:4px;flex-wrap:wrap;justify-content:flex-end}.acts button{padding:4px 8px;font-size:13px}
h3{font:800 22px var(--disp);margin:20px 0 8px}

.trade{display:grid;gap:18px;grid-template-columns:1fr minmax(230px,.8fr) 1fr;align-items:start}@media (max-width:860px){.trade{grid-template-columns:1fr}}

.tr-row.on{border-color:var(--red);background:color-mix(in srgb,var(--red) 9%,var(--panel))}.tr-row input{flex:none;min-width:0;width:auto}.tr-row .n{flex:1;font-weight:600}.tr-row small{display:block;color:var(--mute);font-weight:400}
.plist{max-height:420px;overflow:auto;margin-top:8px}.big{font:900 44px/1 var(--disp);margin:6px 0}
.clock{background:#1d4f9c;color:#fff}.clock.done{background:#17794f}.pos{background:#2f5fb8}.pos.G{background:#d63a4a}.pos.D{background:#46607a}
table{border-radius:12px}.game,.p,.tr-row,.wk{border-radius:12px}
.pbadge{display:inline-block;margin-left:8px;padding:1px 8px;border-radius:999px;background:#12301f;color:var(--pos);font:700 12px var(--lab);text-transform:uppercase;letter-spacing:.05em;vertical-align:middle}.pbadge.out{background:#1a1f29;color:var(--mute)}
tr.cut td{border-bottom:2px dashed var(--gold)}.sd{color:var(--mute);font-weight:400}
.bracket{display:grid;gap:18px;grid-template-columns:repeat(3,minmax(0,1fr))}@media (max-width:900px){.bracket{grid-template-columns:1fr}}.champ{text-align:center}
.scf{display:grid;grid-template-columns:1fr 78px 78px;gap:6px;align-items:center;margin-top:8px}.scf button{grid-column:1/-1}.scf input{min-width:0;width:100%}.sc summary{cursor:pointer;color:var(--mute);font-size:13px;margin-top:8px}
.mu{display:grid;gap:18px;grid-template-columns:repeat(auto-fit,minmax(340px,1fr));margin-top:16px}.vs{max-width:520px}
.mh{display:flex;justify-content:space-between;align-items:baseline;gap:10px;padding:2px 0 10px;border-bottom:1px solid var(--line);margin-bottom:10px;font-weight:600}.mh b{font:900 36px/1 var(--disp)}
.ms{display:grid;grid-template-columns:52px minmax(0,1fr) auto 60px;gap:8px;align-items:center;padding:7px 0;border-bottom:1px dashed var(--line)}.ms:last-of-type{border-bottom:0}.ms.open .n{color:var(--mute);font-weight:400}
.ms .n{font-weight:600;min-width:0;overflow-wrap:anywhere}.ms .n small{display:block;color:var(--mute);font-weight:400;font-size:12px}.ms .pts{font-size:22px;min-width:0;text-align:right}
.slt{font:800 14px var(--lab);text-align:center;border-radius:4px;padding:3px 0;background:#2f5fb8;color:#fff}.slt.FLEX{background:#6b4fb8}.slt.G{background:#d63a4a}
.gp{display:grid;gap:3px;border:1.5px solid var(--line);border-radius:8px;padding:4px 6px;font-size:12px;color:var(--mute)}.gp.on{border-color:var(--pos);color:var(--ink);background:#0f2219}
.gp b{font:800 20px/1 var(--disp);color:inherit}.gp label{display:flex;gap:4px;align-items:center;cursor:pointer}.gp input[type=radio]{flex:none;min-width:0;width:auto;margin:0}.gp input[type=number]{min-width:0;width:100%;padding:4px 6px;font-size:14px}
.gps{display:flex;gap:6px}.gps>.gp{width:104px}
.mcol{container-type:inline-size}@container (max-width:560px){.ms{grid-template-columns:48px minmax(0,1fr) 56px;row-gap:6px}.ms .slt{grid-row:1;grid-column:1}.ms .n{grid-row:1;grid-column:2}.ms .pts{grid-row:1;grid-column:3}.ms .gps{grid-row:2;grid-column:1/-1;flex-wrap:wrap}.ms .gps>.gp{flex:1 1 90px;width:auto}}
/* ===== Theme: Stick Catalog look (light + dark, follows the device) ===== */
:root{color-scheme:light;
  --bg:#e9eff5;--card:#ffffff;--chip:#dde7f1;--fg:#132030;--dim:#6b7c8d;--hover:#a9bfd6;--pos-bg:#e3f4ea;
  --ice:var(--bg);--panel:#ffffff;--ink:var(--fg);--mute:#56687a;--line:#cfdbe6;
  --red:#d4142f;--red-deep:#b00f26;--blue:#1d55c4;--pos:#13804d;--gold:#d4142f;
  --shadow:0 1px 0 rgba(19,32,48,.06),0 6px 18px -10px rgba(19,32,48,.35);
  --disp:"Chakra Petch","Arial Narrow",sans-serif;
  --body:"Atkinson Hyperlegible",system-ui,-apple-system,"Segoe UI",sans-serif;
  --lab:var(--body);--mono:"JetBrains Mono",ui-monospace,Menlo,Consolas,monospace}
@media (prefers-color-scheme:dark){:root{color-scheme:dark;
  --bg:#0b1119;--card:#121b26;--chip:#1a2533;--fg:#e6edf5;--dim:#646e79;--hover:#2f4157;--pos-bg:#10261b;
  --panel:#121b26;--mute:#8fa1b4;--line:#223042;
  --red:#ff4a62;--red-deep:#d8344b;--blue:#6d9bff;--pos:#3ddc97;--gold:#ff4a62;
  --shadow:0 1px 0 rgba(0,0,0,.4),0 10px 24px -14px rgba(0,0,0,.8)}}
body{background:var(--bg);color:var(--fg);font:400 15px/1.5 var(--body)}
/* sidebar = the catalog's set rail */
.side{background:var(--bg);border-right:1px solid var(--line)}
.brand{position:relative;border-bottom:0;padding-bottom:18px}
.brand::after{content:"";position:absolute;left:0;right:0;bottom:0;height:9px;background:linear-gradient(var(--red),var(--red)) top/100% 3px no-repeat,linear-gradient(var(--blue),var(--blue)) bottom/100% 2px no-repeat}
.brand b{font:700 24px/1 var(--disp);letter-spacing:.01em}.brand small{color:var(--mute)}
nav{gap:2px}
nav a{padding:8px 10px;border-radius:6px;color:var(--mute);font:700 14px/1.2 var(--body);text-transform:none;letter-spacing:0}
nav a svg{width:18px;height:18px}
nav a:hover{background:var(--chip);color:var(--fg)}
nav a[aria-current=page]{background:var(--chip);color:var(--fg);box-shadow:inset 3px 0 0 var(--red)}
nav a.stat{color:var(--red);font-family:var(--mono);font-weight:600;font-size:13px;letter-spacing:.04em;text-transform:uppercase}
nav a.stat:hover{background:var(--chip)}
.side #who{color:var(--mute);border-top:1px solid var(--line);font-family:var(--mono);font-size:12px}
@media (max-width:900px){.side{border-right:0;border-bottom:1px solid var(--line)}nav a{flex:none;background:var(--chip);border-radius:999px;padding:6px 12px;font-size:13px}nav a[aria-current=page]{background:var(--fg);color:var(--bg);box-shadow:none}}
nav a:focus-visible,button:focus-visible,input:focus-visible,select:focus-visible,.tl:focus-visible{outline:2px solid var(--red);outline-offset:2px}
/* headings */
h2{font:700 clamp(28px,4vw,40px)/1.05 var(--disp);letter-spacing:.01em;margin:0 0 14px}
#view>h2:first-child{position:relative;padding-bottom:16px;margin-bottom:16px}
#view>h2:first-child::after{content:"";position:absolute;left:0;right:0;bottom:0;height:9px;background:linear-gradient(var(--red),var(--red)) top/100% 3px no-repeat,linear-gradient(var(--blue),var(--blue)) bottom/100% 2px no-repeat}
h3{font:700 21px var(--disp);letter-spacing:.02em;padding-bottom:8px;border-bottom:1px dashed var(--line)}
.note{color:var(--mute);font-size:13.5px}.msg{color:var(--blue)}
/* cards */
.game,.p,.tr-row,.wk,.cell,table{background:var(--card);border:1px solid var(--line);border-radius:10px}
.game,.p,.tr-row{transition:border-color .15s,box-shadow .15s}
.p:hover,.tr-row:hover{border-color:color-mix(in srgb,var(--blue) 45%,var(--line));box-shadow:var(--shadow)}
.empty{border:1px dashed var(--hover);border-radius:10px;color:var(--mute);background:transparent}
.wk summary{font:700 22px var(--disp)}.wk summary span{font-family:var(--mono);font-size:12.5px}
.row b,.mh b,.big,.pts{font-family:var(--disp);font-weight:700}
.row.lead b{color:var(--red)}
.proj{color:var(--mute);font-family:var(--mono);font-size:12px;border-top:1px dashed var(--line)}
/* tables */
th{font:700 11px var(--body);letter-spacing:.14em;text-transform:uppercase;color:var(--mute)}
th,td{border-bottom:1px solid var(--line)}
td.rk{font:700 30px/1 var(--disp);color:var(--blue)}
tr.me{background:color-mix(in srgb,var(--red) 8%,var(--card))}tr.me td.rk{color:var(--red)}
.own,.sd{color:var(--mute)}
td:not(:nth-child(2)){font-variant-numeric:tabular-nums}
/* badges and chips */
.pos{font:600 12px/1.6 var(--mono);background:var(--chip);color:var(--fg);border-radius:5px;padding:2px 6px}
.pos.G{background:var(--red);color:#fff}.pos.D{background:var(--chip)}
.slt{font:600 12px/1.6 var(--mono);border-radius:5px;background:var(--blue);color:#fff}.slt.FLEX{background:#7a5cd6}.slt.G{background:var(--red)}
.pbadge{font:600 11px var(--mono);background:var(--pos-bg);color:var(--pos);border-radius:4px;letter-spacing:.04em}
.pbadge.out{background:var(--chip);color:var(--mute)}
/* controls */
button{font:700 13px var(--body);border:1.5px solid var(--line);background:var(--panel);color:var(--fg);border-radius:8px;padding:7px 12px}
button:hover{background:var(--panel);color:var(--fg);border-color:var(--blue)}
input,select{font:400 15px var(--body);border:1.5px solid var(--line);border-radius:8px;background:var(--panel);color:var(--fg)}
input:focus,select:focus{outline:none;border-color:var(--red)}
/* draft + banners */
.clock{background:var(--panel);color:var(--fg);border:1px solid var(--line);border-left:6px solid var(--red);border-radius:10px;box-shadow:var(--shadow)}
.clock b{font:700 28px/1.1 var(--disp)}.clock.done{background:var(--panel);border-left-color:var(--pos)}
.dh{font:700 14px/1.15 var(--body);color:var(--mute)}.dh.me{color:var(--red)}
.cell{border-radius:6px}.cell.now{border:2px solid var(--red)}.cell.mine{background:color-mix(in srgb,var(--red) 8%,var(--card))}
.cell small,.cell .no{color:var(--mute);font-family:var(--mono);font-size:11px}
/* matchup game picks */
.gp{border:1.5px solid var(--line);border-radius:8px;color:var(--mute);background:var(--panel)}
.gp.on{border-color:var(--blue);color:var(--fg);background:color-mix(in srgb,var(--blue) 10%,var(--panel))}
.gp input[type=number]{background:var(--bg)}
.ms{border-bottom:1px dashed var(--line)}
tr.cut td{border-bottom:2px dashed var(--red)}
.tr-row.on{border-color:var(--red);background:color-mix(in srgb,var(--red) 8%,var(--card))}
.ov{position:fixed;inset:0;z-index:50;display:flex;align-items:center;justify-content:center;padding:16px;background:color-mix(in srgb,var(--bg) 75%,transparent);backdrop-filter:blur(6px);-webkit-backdrop-filter:blur(6px)}
.sheet{position:relative;width:min(520px,100%);max-height:calc(100vh - 32px);overflow:auto;background:var(--panel);border:1px solid var(--line);border-radius:14px;box-shadow:var(--shadow);padding:22px}
.sheet .x{position:absolute;top:12px;right:12px;border:0;background:transparent;font-size:18px;padding:4px 8px;color:var(--mute)}
.sheet h3{font-size:15px;font-family:var(--body);letter-spacing:.12em;text-transform:uppercase;color:var(--mute);margin:16px 0 6px}
.swopt{display:flex;align-items:center;gap:10px;width:100%;text-align:left;margin-bottom:6px;padding:9px 12px;border-radius:10px;font-weight:400}
.swopt .n{flex:1;font-weight:700}.swopt .n small{display:block;color:var(--mute);font-weight:400;font-size:12.5px}.swopt .pts{font-size:20px}
.swopt:disabled{opacity:.5}
.gh{display:flex;align-items:center;justify-content:space-between;gap:4px}
.gvb{all:unset;cursor:pointer;display:flex;align-items:center;gap:4px;border-radius:5px}
.gvb:focus-visible{outline:2px solid var(--red);outline-offset:2px}
.vsh{display:inline-flex;align-items:center;gap:4px;font:600 12px var(--mono);color:inherit}.vsh .lg{width:20px;height:20px;margin:0}
button.gp.gvb{display:grid;gap:3px;text-align:left;width:100%;box-sizing:border-box;border:1.5px solid var(--line);border-radius:8px;padding:4px 6px;background:var(--panel);color:var(--mute);font-size:12px}button.gp.gvb.on{border-color:var(--blue);color:var(--fg);background:color-mix(in srgb,var(--blue) 10%,var(--panel))}button.gp.gvb:hover{border-color:var(--blue)}button.gp.gvb b{font:700 20px/1 var(--disp);color:inherit}
.gp label{font-size:11.5px}
.gvs .row{align-items:center}.gvs .lg{width:30px;height:30px}
.srow{display:grid;grid-template-columns:1fr auto 56px;gap:10px;align-items:baseline;padding:6px 0;border-bottom:1px dashed var(--line)}.srow b{font:700 18px var(--disp)}.srow small{font:600 12px var(--mono);color:var(--mute);text-align:right}
.logo-ed{align-items:center}.logo-ed .lg{width:56px;height:56px;border-radius:10px;background:var(--chip);margin:0}
.upl{display:inline-flex;align-items:center;cursor:pointer;font:700 13px var(--body);border:1.5px solid var(--line);background:var(--panel);color:var(--fg);border-radius:8px;padding:7px 12px}.upl:hover{border-color:var(--blue)}.upl:focus-within{outline:2px solid var(--red);outline-offset:2px}
.vh{position:absolute;width:1px;height:1px;opacity:0;overflow:hidden;pointer-events:none}
.sheet.wide{width:min(760px,100%)}
.lgrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(118px,1fr));gap:8px;margin-top:12px}
.lopt{display:grid;justify-items:center;align-content:start;gap:3px;padding:10px 6px;border-radius:10px;background:var(--panel);text-align:center}.lopt b{font:700 12.5px/1.2 var(--body)}.lopt img{width:72px;height:72px;object-fit:contain}.lopt small{font:600 11px var(--mono);color:var(--mute)}
.lopt:hover{border-color:var(--blue)}
.usebox{display:flex;align-items:center;gap:10px;flex-wrap:wrap;margin:6px 0 10px}.usebox.on span{font-weight:700;color:var(--pos)}
.opts{display:grid;gap:8px}.opt{display:flex;gap:10px;align-items:flex-start;padding:10px 12px;border:1.5px solid var(--line);border-radius:10px;cursor:pointer;background:var(--panel)}.opt:has(input:checked){border-color:var(--blue);background:color-mix(in srgb,var(--blue) 8%,var(--panel))}.opt input{flex:none;min-width:0;width:auto;margin-top:4px}.opt b{display:block}.opt small{color:var(--mute);font-size:13px}
.ordl{list-style:none;padding:0;margin:8px 0 0;display:grid;gap:6px}.ordl li{display:flex;align-items:center;gap:10px;padding:6px 10px;border:1px solid var(--line);border-radius:10px;background:var(--panel)}.ordl .n{flex:1;font-weight:700}.ordl .n small{display:block;color:var(--mute);font-weight:400;font-size:12px}.ordl .lg{width:30px;height:30px;margin:0}.onum{font:700 18px var(--disp);width:28px;text-align:center;color:var(--blue)}
button.primary{background:var(--red);border-color:var(--red);color:#fff}button.primary:hover{background:var(--red-deep);border-color:var(--red-deep);color:#fff}
.dpk{display:block;font:600 11px var(--mono);color:var(--mute);margin-bottom:2px}
.gp.none{border-style:dashed;opacity:.55;justify-content:center}.gp.none small{font-size:11px}
.topbid{display:flex;flex-direction:column;align-items:center;gap:2px;margin:10px 0 6px;padding:12px;border-radius:12px;background:var(--chip)}.topbid span{font:700 13px var(--body);letter-spacing:.14em;text-transform:uppercase;color:var(--mute)}.topbid b{font:700 clamp(64px,12vw,120px)/1 var(--disp);color:var(--red);font-variant-numeric:tabular-nums}
#gt{font-size:20px}
.gposq{margin-top:10px;align-items:center}.gposq span{font-weight:700}.gpk{display:inline-flex;align-items:center;gap:6px;margin:2px 10px 2px 0}.gpos{padding:3px 6px;font-size:13px}
.gslots{display:grid;gap:6px;min-width:240px}.gslot{display:flex;align-items:center;gap:8px;flex-wrap:wrap}.gslot b{font-weight:700}.gsl{font:600 11px var(--mono);text-transform:uppercase;letter-spacing:.06em;color:var(--mute);min-width:82px}.gslot.un .gsl{color:var(--red)}
button.mini{padding:2px 8px;font-size:12px}
.gposgrid{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-top:10px}.gposbig{display:grid;gap:4px;padding:16px 12px;border-radius:12px;text-align:center}.gposbig b{font:700 22px var(--disp)}.gposbig small{color:var(--mute);font-weight:400}.gposbig.on{border-color:var(--red);background:color-mix(in srgb,var(--red) 10%,var(--panel))}
</style>
</head>

if(!v||v.length>30){msg='Team names need 1 to 30 characters.';return render()}
const r=await sb.from('team_names').upsert({idx:t,name:v});msg=r.error?'Could not save the team name.':'Team name saved.';await loadAll();render()}
$("#view").addEventListener("click",async e=>{const d=e.target.dataset;
if(d.pick)sendPick(+d.pick,false);
if("auto" in d){const t=new Set(DR.map(x=>x.pid)),b=DPLAYERS.filter(p=>!t.has(p.id)).sort((x,y)=>y.pts-x.pts)[0];if(b)sendPick(b.id,false)}
if("dstart" in d&&ADM){const r=await sb.rpc('draft_start');msg=!r.error?'Draft started.':'Could not start the draft: '+r.error.message;await loadDraft();render()}
if("undo" in d&&ADM&&DR.length){const r=await sb.rpc('draft_undo');msg=!r.error?'Last pick undone.':'Could not undo: '+r.error.message;await loadDraft();render()}
if("reset" in d&&ADM){if(rc){const r=await sb.rpc('draft_reset');RS={added:[],cut:[],st:{}};saveRS();rc=false;msg=!r.error?'Draft reset.':'Could not reset: '+r.error.message;await loadDraft()}else{rc=true;msg='Press again to clear all picks.'}render()}
});
addEventListener("hashchange",()=>{msg="";amsg="";SWAP=null;GST=null;LPICK=false;render()});
$("#view").addEventListener("click",e=>{const d=e.target.dataset;if('logout' in d){sb.auth.signOut().then(()=>{SES=null;ADM=false;amsg='Logged out.';render()})}if('login' in d)doLogin();if('register' in d)doReg();if(d.kick)kick(d.kick);if(d.restore)restore(d.restore);if(d.start)setSt(d.start,'S');if(d.bench)setSt(d.bench,'B');if(d.cut)cutP(d.cut);if(d.fa)addFA(d.fa);if('savename' in d)saveName();if(d.wk)saveSet('league_week',Math.min(7,Math.max(0,SET.week+ +d.wk)));
if('tclear' in d){TR.send=[];TR.recv=[];TR.note='';render()}
if('tsend' in d)sendTrade();
if(d.tacc)respond(+d.tacc,'accept');if(d.tdec)respond(+d.tdec,'decline');if(d.tcan)respond(+d.tcan,'cancel');
if('gopen' in d)gcall('open_lobby',gcfg(),'Lobby opened.');
if('gset' in d)gcall('game_settings',gcfg(),'Settings saved.');
if('gjoin' in d)gcall('join_game',{},'You joined the game.');
if('gstart' in d){const pl=$('#gpool')?$('#gpool').value:GPOOL,src=pl=='sk'?DPLAYERS.filter(p=>!p.g):pl=='g'?DPLAYERS.filter(p=>p.g):DPLAYERS,ids=src.map(p=>p.id),c=gcfg();for(let i=ids.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[ids[i],ids[j]]=[ids[j],ids[i]]}
gcall('game_settings',c,'').then(()=>gcall('start_game',{p_order:ids},'Game started!'))}
if('gpause' in d)gcall('pause_game',{},'Game paused.');
if('gresume' in d)gcall('resume_game',{},'Game resumed.');
if('gskip' in d)gcall('skip_round',{},'Player skipped.');
if('gend' in d){if(GCONF=='end'){GCONF='';gcall('end_game',{},'Bidding ended. Voting is open.')}else{GCONF='end';msg='Press End bidding again to confirm.';render()}}
if('greset' in d){if(GCONF=='reset'){GCONF='';gcall('reset_game',{},'Game reset.')}else{GCONF='reset';msg='Press Reset game again to confirm.';render()}}
if(d.gmoney){const el=document.querySelector(`[data-gmi="${d.gmoney}"]`);if(el)gcall('set_player_money',{p_id:d.gmoney,p_money:+el.value||0},'Money updated.')}
if(d.sscore)saveScore(d.sscore);
if(d.mlock)lockPts(+d.mlock);if(d.munlock)unlockPts(d.munlock);if(d.mbest)bestPts(+d.mbest);
if(d.gvote)gcall('cast_vote',{p_candidate:d.gvote},'Vote cast.');if('gclose' in d)gcall('close_voting',{},'Voting closed.');
if(d.gbid)gcall('place_bid',{p_amt:GS.cur_bid+ +d.gbid},'Bid placed.');
if('gbidc' in d)gcall('place_bid',{p_amt:+($('#gamt').value||0)},'Bid placed.')
});
$("#view").addEventListener("change",e=>{const d=e.target.dataset;
if(e.target.id=='mw'){MW=+e.target.value;LCONF='';msg='';render()}if(e.target.id=='mt'){MT=+e.target.value;LCONF='';msg='';render()}
if(d.mg){const a=d.mg.split('-');setME(a[0]+'-'+a[1],'g'+a[2],e.target.value===''?0:+e.target.value);autoSave(+a[0]);setTimeout(()=>{const f=document.activeElement,fk=f&&f.dataset&&f.dataset.mg;render();if(fk){const n=document.querySelector(`[data-mg="${fk}"]`);if(n){n.focus();n.select&&n.select()}}},0)}
if(d.mpick){const a=d.mpick.split('-');setME(a[0]+'-'+a[1],'pick',+a[2]);autoSave(+a[0]);render()}if(e.target.id=='tt'){TR.to=+e.target.value;TR.recv=[];render()}
if(e.target.id=='gr')GR=+e.target.value;if(e.target.id=='gs')GSS=+e.target.value;if(e.target.id=='gn')GSN=+e.target.value;if(e.target.id=='gm')GM=+e.target.value||GM;if(e.target.id=='gpool')GPOOL=e.target.value;
if(d.ts!=null&&e.target.type=='checkbox'){TR.send=tog(TR.send,+d.ts);render()}
if(d.tr!=null&&e.target.type=='checkbox'){TR.recv=tog(TR.recv,+d.tr);render()}
if(d.assign)assign(d.assign,e.target.value);if(d.set)saveSet(d.set,e.target.value);if(e.target.id=='hd'){HIDE=e.target.checked;try{localStorage.setItem('blueline-hide',HIDE?'1':'0')}catch(x){}render()}});
render();
loadAll();setInterval(loadAll,20000);loadLogos();setInterval(loadLogos,30000);loadLogoList();loadDraft();let LDT=0;setInterval(()=>{if(location.hash=='#draft'||Date.now()-LDT>4000){LDT=Date.now();loadDraft()}},1000);
loadTrades();setInterval(loadTrades,4000);loadScores();setInterval(loadScores,5000);loadPts();setInterval(loadPts,5000);loadBHL();setInterval(loadBHL,300000);advanceWeek();setInterval(advanceWeek,600000);loadGame();setInterval(()=>{if(location.hash=='#game')loadGame()},800);
let GPHASE='';
setInterval(()=>{if(location.hash!='#game'||!GS||GS.status!='bidding'||GS.paused)return;const now=SNOW(),gap=GS.gap_until&&now<GS.gap_until,left=(GS.ends_at-now)/1000,ph=gap?'gap':left>0?'open':'closed';
if(ph!==GPHASE){GPHASE=ph;soft()}
const el=$('#gt'),gg=$('#gg');if(gg&&gap)gg.textContent=Math.max(1,Math.ceil((GS.gap_until-now)/1000));
if(el&&!gap){el.textContent=left>0?Math.ceil(left)+'s':'Time!';el.classList.toggle('cold',left<=5)}
if(left<=0&&Date.now()-GLAST>1000){GLAST=Date.now();sb.rpc('resolve_round').then(loadGame)}},200);
syncClock();setInterval(syncClock,60000);
